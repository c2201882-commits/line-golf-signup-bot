<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>高爾夫開團表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
/* Always light/white-toned, regardless of the device's system dark mode setting. */
:root {
  --bg: #ffffff;
  --surface: #ffffff;
  --surface-2: #f4f2ec;
  --border: #e3ddd0;
  --text: #3a352e;
  --muted: #8a8275;
  --accent: #7c8c6a;
  --accent-strong: #5f6f4f;
  --accent-soft: #e7ebe0;
  --status-none: #8a9a7e;
  --status-none-soft: #eef1e9;
  --status-low: #b98f3f;
  --status-low-soft: #f5ecd8;
  --status-full: #6c8598;
  --status-full-soft: #e7edf1;
  --danger: #b5574a;
  --danger-soft: #f3e4e0;
  --shadow: rgba(50, 40, 20, 0.06);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: "Noto Sans TC", "Zen Maru Gothic", -apple-system, "Segoe UI", sans-serif;
  min-height: 100vh; -webkit-font-smoothing: antialiased;
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

.hero {
  min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 40px 20px; gap: 18px;
}
.hero .hero-mark { font-size: 40px; }
.hero h2 {
  font-family: "Zen Maru Gothic", sans-serif; font-weight: 500; font-size: clamp(24px, 6vw, 34px);
  margin: 0; text-wrap: balance; letter-spacing: 0.02em;
}
.hero p { font-size: 14px; color: var(--muted); margin: 0; max-width: 320px; line-height: 1.7; }
.hero .scroll-cue {
  position: absolute; bottom: 28px; display: flex; flex-direction: column; align-items: center; gap: 6px;
  background: none; border: none; color: var(--muted); cursor: pointer; font-family: inherit; font-size: 12px;
}
.hero-wrap { position: relative; }
.scroll-arrow { font-size: 18px; animation: bob 1.8s ease-in-out infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(6px); } }
@media (prefers-reduced-motion: reduce) { .scroll-arrow { animation: none; } }

.wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }

header.top {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
  gap: 14px; margin-bottom: 4px;
}
.eyebrow { font-size: 12px; letter-spacing: 0.04em; color: var(--muted); margin: 0 0 4px; }
.month-row { display: flex; align-items: center; gap: 10px; }
h1 {
  font-family: "Zen Maru Gothic", "Noto Sans TC", sans-serif; font-weight: 500;
  font-size: clamp(20px, 5.5vw, 26px); margin: 0; text-wrap: balance; letter-spacing: 0.01em;
}
.month-nav {
  display: flex; align-items: center; justify-content: center; width: 30px; height: 30px;
  border-radius: 50%; border: 1px solid var(--border); background: var(--surface);
  color: var(--text); font-size: 14px; cursor: pointer; flex-shrink: 0;
  transition: border-color 0.15s ease, background 0.15s ease;
}
.month-nav:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.month-nav:disabled { opacity: 0.35; cursor: not-allowed; }

.account { position: relative; }
.me {
  display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted);
  background: none; border: none; cursor: pointer; padding: 4px 6px; border-radius: 999px;
  transition: background 0.15s ease;
}
.me:hover { background: var(--surface-2); }
.me img { width: 26px; height: 26px; border-radius: 50%; }
.me .chev { font-size: 10px; color: var(--muted); }
.account-menu {
  position: absolute; right: 0; top: calc(100% + 6px); min-width: 140px; background: var(--surface);
  border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 4px 16px var(--shadow);
  display: none; overflow: hidden; z-index: 40;
}
.account-menu.open { display: block; }
.account-menu button {
  width: 100%; text-align: left; padding: 10px 14px; font-size: 13px; background: none; border: none;
  color: var(--text); cursor: pointer; font-family: inherit;
}
.account-menu button:hover { background: var(--surface-2); }

.tabs { display: flex; gap: 6px; margin: 18px 0 20px; border-bottom: 1px solid var(--border); }
.tab-btn {
  font-family: inherit; font-size: 14px; font-weight: 500; padding: 10px 4px; margin-bottom: -1px;
  background: none; border: none; border-bottom: 2px solid transparent; color: var(--muted); cursor: pointer;
}
.tab-btn.active { color: var(--accent-strong); border-bottom-color: var(--accent); }
.view { display: none; }
.view.active { display: block; }

.status-line {
  font-size: 12px; color: var(--muted); margin: 0 0 20px; display: flex; align-items: center; gap: 8px;
}
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
.dot.offline { background: var(--danger); }

section.summary {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 16px 16px; margin-bottom: 22px; box-shadow: 0 1px 2px var(--shadow);
}
.summary-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
section.summary h2 { font-family: "Zen Maru Gothic", sans-serif; font-size: 16px; font-weight: 500; margin: 0 0 4px; }
.summary .sub { font-size: 12px; color: var(--muted); margin: 0; }
.copy-btn {
  flex-shrink: 0; font-family: inherit; font-weight: 500; font-size: 12px;
  padding: 7px 12px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface-2);
  color: var(--text); cursor: pointer; transition: border-color 0.15s ease, background 0.15s ease;
}
.copy-btn:hover { border-color: var(--accent); background: var(--accent-soft); }
.copy-btn.copied { border-color: var(--accent); color: var(--accent-strong); }
.confirmed-list { display: flex; flex-direction: column; gap: 8px; }
.confirmed-row {
  display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-radius: 9px;
  background: var(--surface-2); border: 1px solid var(--border);
}
.confirmed-row .headline { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.confirmed-row .rank { font-size: 11px; color: var(--muted); font-weight: 500; width: 18px; flex-shrink: 0; }
.confirmed-row .date-label { font-family: "Zen Maru Gothic", sans-serif; font-weight: 500; font-size: 14px; flex-shrink: 0; }
.confirmed-row .players { font-size: 12px; color: var(--muted); flex: 1; min-width: 100px; overflow-wrap: anywhere; }
.confirmed-row .count { font-size: 12px; font-weight: 500; color: var(--accent-strong); flex-shrink: 0; }
.confirmed-row .fields { display: grid; grid-template-columns: 1fr 120px; gap: 8px; }
.confirmed-row .fields input {
  font-family: inherit; font-size: 13px; padding: 7px 9px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text); outline: none; width: 100%; transition: border-color 0.15s ease;
}
.confirmed-row .fields input:focus { border-color: var(--accent); }
.confirmed-row .fields input::placeholder { color: var(--muted); }
@media (max-width: 460px) { .confirmed-row .fields { grid-template-columns: 1fr; } }
.confirmed-row.past { opacity: 0.6; }
.empty-note { font-size: 12px; color: var(--muted); }

.list-toggle {
  font-family: inherit; font-weight: 500; font-size: 12px;
  padding: 9px 12px; border-radius: 8px; border: 1px dashed var(--border); background: transparent;
  color: var(--muted); cursor: pointer; text-align: center; transition: border-color 0.15s ease, color 0.15s ease;
}
.list-toggle:hover { border-color: var(--accent); color: var(--accent-strong); }
.list-toggle.past-toggle { margin-top: 4px; }

.cal-weekday-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 6px; }
.cal-weekday-row span {
  text-align: center; font-size: 10.5px; letter-spacing: 0.04em; color: var(--muted);
}
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.day-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 9px;
  padding: 7px 5px 6px; display: flex; flex-direction: column; gap: 4px; min-height: 78px;
  transition: border-color 0.15s ease;
}
.day-card.empty { background: transparent; border: none; }
.day-card.voted { border-color: var(--accent); }
.day-card.weekend .daynum { color: var(--accent-strong); }
.day-card.past { opacity: 0.5; }
.day-card.past .daynum { text-decoration: line-through; color: var(--muted); }
.day-card.past.weekend .daynum { color: var(--muted); }
.day-card .daynum { font-family: "Zen Maru Gothic", sans-serif; font-size: 15px; font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; }
.day-card .count-badge {
  font-size: 10px; font-weight: 500;
  border-radius: 999px; padding: 1px 6px; align-self: flex-start;
}
.day-card .count-badge.status-none { color: var(--status-none); background: var(--status-none-soft); }
.day-card .count-badge.status-low { color: var(--status-low); background: var(--status-low-soft); }
.day-card .count-badge.status-full { color: var(--status-full); background: var(--status-full-soft); }
.day-card button.toggle {
  margin-top: auto; font-family: inherit; font-weight: 500; font-size: 11px;
  padding: 5px 4px; border-radius: 6px; border: 1px solid var(--border); background: transparent;
  color: var(--muted); cursor: pointer; transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}
.day-card button.toggle:hover { border-color: var(--accent); color: var(--accent-strong); }
.day-card.voted button.toggle { background: var(--accent); color: #fff; border-color: var(--accent); }
.day-card.voted button.toggle:hover { background: var(--accent-strong); border-color: var(--accent-strong); }

/* headcount picker sheet */
.sheet-backdrop {
  position: fixed; inset: 0; background: rgba(30, 27, 20, 0.4); display: none;
  align-items: flex-end; justify-content: center; z-index: 50;
}
.sheet-backdrop.open { display: flex; }
.sheet {
  background: var(--surface); border-radius: 16px 16px 0 0; padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
  width: 100%; max-width: 480px; box-shadow: 0 -4px 24px var(--shadow);
}
.sheet h3 { font-family: "Zen Maru Gothic", sans-serif; font-size: 16px; font-weight: 500; margin: 0 0 4px; }
.sheet .sheet-sub { font-size: 12px; color: var(--muted); margin: 0 0 18px; }
.stepper { display: flex; align-items: center; justify-content: center; gap: 18px; margin-bottom: 20px; }
.stepper button {
  width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface-2);
  color: var(--text); font-size: 18px; cursor: pointer; line-height: 1;
}
.stepper button:hover { border-color: var(--accent); }
.stepper .count-display {
  font-family: "Zen Maru Gothic", sans-serif; font-size: 26px; font-weight: 500; min-width: 44px; text-align: center;
}
.guest-names { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
.guest-names input {
  font-family: inherit; font-size: 14px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--surface-2); color: var(--text); outline: none; width: 100%; transition: border-color 0.15s ease;
}
.guest-names input:focus { border-color: var(--accent); background: var(--surface); }
.guest-names input::placeholder { color: var(--muted); }
.sheet-actions { display: flex; flex-wrap: wrap; gap: 10px; }
.sheet-actions button {
  flex: 1; min-width: 88px; font-family: inherit; font-weight: 600; font-size: 14px;
  padding: 12px; border-radius: 9px; cursor: pointer; border: 1px solid transparent;
}
.sheet-actions .primary { background: var(--accent); color: #fff; flex-basis: 100%; }
.sheet-actions .primary:hover { background: var(--accent-strong); }
.sheet-actions .ghost { background: transparent; border-color: var(--border); color: var(--text); }
.sheet-actions .ghost:hover { border-color: var(--muted); }
.sheet-actions .ghost.danger { color: var(--danger); }
.sheet-actions .ghost.danger:hover { border-color: var(--danger); background: var(--danger-soft); }

.session-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
.session-item {
  display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
  padding: 10px 12px; border-radius: 9px; border: 1px solid var(--border); background: var(--surface-2);
}
.session-item .s-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.session-item .s-title { font-size: 13.5px; font-weight: 500; color: var(--text); }
.session-item .s-sub { font-size: 11.5px; color: var(--muted); }
.session-item .s-actions { display: flex; gap: 6px; flex-shrink: 0; }
.session-item button {
  flex-shrink: 0; font-family: inherit; font-weight: 600; font-size: 12.5px; padding: 7px 12px;
  border-radius: 7px; border: 1px solid var(--accent); background: transparent; color: var(--accent-strong); cursor: pointer;
}
.session-item button:hover { background: var(--accent-soft); }
.session-item button.danger { border-color: var(--border); color: var(--muted); }
.session-item button.danger:hover { border-color: var(--danger); color: var(--danger); background: var(--danger-soft); }

/* message board */
.board-composer { margin-bottom: 20px; }
.board-composer textarea {
  width: 100%; font-family: inherit; font-size: 14px; padding: 12px 14px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--surface); color: var(--text); resize: vertical;
  min-height: 72px; outline: none; transition: border-color 0.15s ease;
}
.board-composer textarea:focus { border-color: var(--accent); }
.board-composer .row { display: flex; justify-content: flex-end; margin-top: 8px; }
.board-composer button {
  font-family: inherit; font-weight: 600; font-size: 13px; padding: 9px 16px; border-radius: 8px;
  border: 1px solid transparent; background: var(--accent); color: #fff; cursor: pointer;
}
.board-composer button:hover { background: var(--accent-strong); }
.board-composer button:disabled { opacity: 0.4; cursor: not-allowed; }
.board-list { display: flex; flex-direction: column; gap: 10px; }
.board-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px;
}
.board-card.pinned { border-color: var(--status-low); background: var(--status-low-soft); }
.board-card .b-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.board-card .b-head img { width: 22px; height: 22px; border-radius: 50%; }
.board-card .b-name { font-size: 12.5px; font-weight: 600; color: var(--text); }
.board-card .b-time { font-size: 11px; color: var(--muted); margin-left: auto; }
.board-card .b-text { font-size: 13.5px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
.board-card .b-actions { display: flex; gap: 6px; margin-top: 8px; }
.board-card .b-actions button {
  font-family: inherit; font-size: 11.5px; padding: 5px 9px; border-radius: 6px; border: 1px solid var(--border);
  background: transparent; color: var(--muted); cursor: pointer;
}
.board-card .b-actions button:hover { border-color: var(--accent); color: var(--accent-strong); }
.board-card .b-actions button.danger:hover { border-color: var(--danger); color: var(--danger); }
.board-card .pin-flag { font-size: 11px; color: var(--status-low); font-weight: 600; margin-right: 6px; }

button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
footer.note { margin-top: 28px; font-size: 11.5px; color: var(--muted); text-align: center; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="hero-wrap">
  <section class="hero">
    <div class="hero-mark">⛳</div>
    <h2>球局報名，一起打球</h2>
    <p>選日期、填人數，也能幫朋友一起報名。向下滑動開始使用。</p>
  </section>
  <button type="button" class="scroll-cue" id="scroll-cue">
    <span class="scroll-arrow">︾</span>
    開始使用
  </button>
</div>
<div class="wrap" id="main-content">
  <header class="top">
    <div>
      <p class="eyebrow" id="cycle-label">開放投票</p>
      <div class="month-row">
        <button class="month-nav" id="prev-month" type="button" aria-label="上個月">‹</button>
        <h1 id="month-title">載入中…</h1>
        <button class="month-nav" id="next-month" type="button" aria-label="下個月">›</button>
      </div>
    </div>
    <div class="account">
      <button type="button" class="me" id="me-box">連接 LINE 中…</button>
      <div class="account-menu" id="account-menu">
        <button type="button" id="logout-btn">登出 / 切換帳號</button>
      </div>
    </div>
  </header>

  <div class="tabs">
    <button type="button" class="tab-btn active" id="tab-signup">報名球局</button>
    <button type="button" class="tab-btn" id="tab-board">留言板</button>
  </div>

  <p class="status-line"><span class="dot" id="conn-dot"></span><span id="conn-text">連線中…</span></p>

  <div class="view active" id="view-signup">
    <section class="summary">
      <div class="summary-head">
        <div>
          <h2>本月開團球局</h2>
          <p class="sub">任何有人報名的日期即成團，依日期先後排列</p>
        </div>
        <button type="button" class="copy-btn" id="copy-btn">複製名單</button>
      </div>
      <div class="confirmed-list" id="confirmed-list">
        <p class="empty-note">目前還沒有人報名</p>
      </div>
    </section>

    <div id="calendar"></div>

    <footer class="note">報名即時同步給所有人 · 可以幫朋友一起報名</footer>
  </div>

  <div class="view" id="view-board">
    <div class="board-composer">
      <textarea id="board-input" placeholder="留言給大家看看…" maxlength="500"></textarea>
      <div class="row">
        <button type="button" id="board-post">發表留言</button>
      </div>
    </div>
    <div class="board-list" id="board-list">
      <p class="empty-note">還沒有人留言</p>
    </div>
  </div>
</div>

<div class="sheet-backdrop" id="picker-backdrop">
  <div class="sheet">
    <h3 id="picker-title">選擇球局</h3>
    <p class="sheet-sub">這天已經有球局了，選一個報名，或是開新的一團（例如早團／午團）</p>
    <div class="session-list" id="session-list"></div>
    <div class="sheet-actions">
      <button type="button" class="ghost" id="picker-cancel">取消</button>
      <button type="button" class="primary" id="picker-new">＋ 開新的球局</button>
    </div>
  </div>
</div>

<div class="sheet-backdrop" id="sheet-backdrop">
  <div class="sheet">
    <h3 id="sheet-title">選擇人數</h3>
    <p class="sheet-sub" id="sheet-sub"></p>
    <div class="stepper">
      <button type="button" id="step-minus" aria-label="減少">−</button>
      <span class="count-display" id="step-count">1</span>
      <button type="button" id="step-plus" aria-label="增加">+</button>
    </div>
    <div class="guest-names" id="guest-names"></div>
    <div class="sheet-actions">
      <button type="button" class="ghost" id="sheet-exit">退出</button>
      <button type="button" class="ghost danger" id="sheet-delete">刪除球局</button>
      <button type="button" class="primary" id="sheet-save">儲存</button>
    </div>
  </div>
</div>

<script>
(function () {
  document.getElementById("scroll-cue").addEventListener("click", () => {
    document.getElementById("main-content").scrollIntoView({ behavior: "smooth" });
  });

  const WEEKDAY_NAMES = ["日", "一", "二", "三", "四", "五", "六"];
  function pad(n) { return String(n).padStart(2, "0"); }

  function computeFloorMonth() {
    const now = new Date();
    return { year: now.getFullYear(), month: now.getMonth() };
  }
  function computeDefaultMonth() {
    const now = new Date();
    return { year: now.getFullYear(), month: now.getMonth() };
  }
  function buildMonthDates(year, month) {
    const dates = [];
    const d = new Date(year, month, 1);
    while (d.getMonth() === month) {
      dates.push({ key: `${year}-${pad(month + 1)}-${pad(d.getDate())}`, day: d.getDate(), dow: d.getDay() });
      d.setDate(d.getDate() + 1);
    }
    return dates;
  }

  const params = new URLSearchParams(location.search);
  // Everyone shares one board unless the page is explicitly opened with a
  // ?groupId=... link (e.g. a per-team deep link sent from the LINE bot).
  let groupId = params.get("groupId") || "default";

  const floorMonth = computeFloorMonth();
  let target = computeDefaultMonth();
  let monthKey, monthDates, daysData = {};

  function setupMonthState() {
    monthKey = `${target.year}-${target.month + 1}`;
    monthDates = buildMonthDates(target.year, target.month);
  }
  setupMonthState();

  const calendarEl = document.getElementById("calendar");
  const confirmedEl = document.getElementById("confirmed-list");
  const connDot = document.getElementById("conn-dot");
  const connText = document.getElementById("conn-text");
  const meBox = document.getElementById("me-box");
  const prevBtn = document.getElementById("prev-month");
  const nextBtn = document.getElementById("next-month");
  const cycleLabel = document.getElementById("cycle-label");

  // ---- tabs ----
  const tabSignup = document.getElementById("tab-signup");
  const tabBoard = document.getElementById("tab-board");
  const viewSignup = document.getElementById("view-signup");
  const viewBoard = document.getElementById("view-board");
  tabSignup.addEventListener("click", () => switchTab("signup"));
  tabBoard.addEventListener("click", () => switchTab("board"));
  function switchTab(name) {
    const toSignup = name === "signup";
    tabSignup.classList.toggle("active", toSignup);
    tabBoard.classList.toggle("active", !toSignup);
    viewSignup.classList.toggle("active", toSignup);
    viewBoard.classList.toggle("active", !toSignup);
    if (!toSignup) loadBoard();
  }

  // ---- account menu ----
  const accountMenu = document.getElementById("account-menu");
  meBox.addEventListener("click", (e) => { e.stopPropagation(); accountMenu.classList.toggle("open"); });
  document.addEventListener("click", () => accountMenu.classList.remove("open"));
  document.getElementById("logout-btn").addEventListener("click", () => {
    try { liff.logout(); } catch (e) {}
    location.reload();
  });

  function isAtFloor() { return target.year === floorMonth.year && target.month === floorMonth.month; }

  function updateHeader() {
    document.getElementById("month-title").textContent = `${target.year} 年 ${target.month + 1} 月`;
    const def = computeDefaultMonth();
    cycleLabel.textContent = (target.year === def.year && target.month === def.month) ? "開放投票（本月）" : "開放投票";
    prevBtn.disabled = isAtFloor();
  }

  function changeMonth(delta) {
    let y = target.year, m = target.month + delta;
    if (m < 0) { m = 11; y -= 1; }
    if (m > 11) { m = 0; y += 1; }
    if (y < floorMonth.year || (y === floorMonth.year && m < floorMonth.month)) return;
    target = { year: y, month: m };
    setupMonthState();
    updateHeader();
    lastStateJson = null;
    showPastGames = false;
    expandUpcoming = false;
    loadState();
  }
  prevBtn.addEventListener("click", () => changeMonth(-1));
  nextBtn.addEventListener("click", () => changeMonth(1));

  function dateLabel(dt) { return `${target.month + 1}/${dt.day} (${WEEKDAY_NAMES[dt.dow]})`; }

  // A day can hold more than one session ("球局") — e.g. a morning and an
  // afternoon outing on the same date, each with its own course/time/roster.
  function daySessions(dateKey) {
    const day = daysData[dateKey];
    return (day && day.sessions) || [];
  }
  function sessionEntries(session) {
    return session && session.entries ? Object.entries(session.entries) : [];
  }
  function sessionCount(session) {
    return sessionEntries(session).reduce((sum, [, e]) => sum + (e.count || 1), 0);
  }
  function dayCount(dateKey) {
    return daySessions(dateKey).reduce((sum, s) => sum + sessionCount(s), 0);
  }
  function myCountInSession(session) {
    const mine = session && session.entries && session.entries["line:" + myUserId];
    return mine ? mine.count : 0;
  }
  function dayHasMyEntry(dateKey) {
    return daySessions(dateKey).some((s) => myCountInSession(s) > 0);
  }
  function entryLabel(e) {
    const extra = (e.guestNames || []).map((n) => (n || "").trim()).filter(Boolean);
    const named = [e.displayName, ...extra];
    const unnamed = Math.max(0, (e.count || 1) - named.length);
    return unnamed > 0 ? `${named.join(", ")} +${unnamed}` : named.join(", ");
  }
  function todayKey() {
    const now = new Date();
    return `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
  }
  function isPastDate(dateKey) { return dateKey < todayKey(); }

  function render() {
    calendarEl.innerHTML = "";
    const weekdayRow = document.createElement("div");
    weekdayRow.className = "cal-weekday-row";
    WEEKDAY_NAMES.forEach((w) => {
      const s = document.createElement("span"); s.textContent = w; weekdayRow.appendChild(s);
    });
    calendarEl.appendChild(weekdayRow);

    const grid = document.createElement("div");
    grid.className = "cal-grid";
    for (let i = 0; i < monthDates[0].dow; i++) {
      const blank = document.createElement("div"); blank.className = "day-card empty"; grid.appendChild(blank);
    }

    monthDates.forEach((dt) => {
      const count = dayCount(dt.key);
      const iVoted = dayHasMyEntry(dt.key);
      const isWeekend = dt.dow === 0 || dt.dow === 6;
      const isPast = isPastDate(dt.key);

      const card = document.createElement("div");
      card.className = "day-card" + (iVoted ? " voted" : "") + (isWeekend ? " weekend" : "") + (isPast ? " past" : "");

      const num = document.createElement("span");
      num.className = "daynum"; num.textContent = dt.day;

      const status = count === 0 ? "status-none" : count < 4 ? "status-low" : "status-full";
      const badge = document.createElement("span");
      badge.className = "count-badge " + status;
      badge.textContent = count === 0 ? "無人報名" : `${count} 人`;

      const btn = document.createElement("button");
      btn.className = "toggle";
      btn.textContent = iVoted ? "編輯" : "報名";
      btn.disabled = isPast;
      btn.addEventListener("click", () => openDayEntry(dt.key));

      card.appendChild(num); card.appendChild(badge); card.appendChild(btn);
      grid.appendChild(card);
    });
    calendarEl.appendChild(grid);
    renderConfirmed();
  }

  let showPastGames = false;
  let expandUpcoming = false;
  const UPCOMING_PREVIEW_COUNT = 3;

  function buildConfirmedRow(r, rank, isPast) {
    const row = document.createElement("div"); row.className = "confirmed-row" + (isPast ? " past" : "");
    const headline = document.createElement("div"); headline.className = "headline";
    const rankEl = document.createElement("span"); rankEl.className = "rank"; rankEl.textContent = "#" + rank;
    const dl = document.createElement("span"); dl.className = "date-label"; dl.textContent = dateLabel(r.dt);
    const pl = document.createElement("span"); pl.className = "players";
    pl.textContent = sessionEntries(r.session).map(([, e]) => entryLabel(e)).join("、");
    const ct = document.createElement("span"); ct.className = "count"; ct.textContent = `${r.count} 人`;
    headline.appendChild(rankEl); headline.appendChild(dl); headline.appendChild(pl); headline.appendChild(ct);

    const fields = document.createElement("div"); fields.className = "fields";
    const courseInput = document.createElement("input");
    courseInput.type = "text"; courseInput.placeholder = "球場名稱"; courseInput.maxLength = 60;
    courseInput.value = r.session.course || "";
    courseInput.addEventListener("change", () => saveSessionInfo(r.dt.key, r.session.id, { course: courseInput.value.trim() }));
    const timeInput = document.createElement("input");
    timeInput.type = "text"; timeInput.placeholder = "開球時間"; timeInput.maxLength = 20;
    timeInput.value = r.session.teeTime || "";
    timeInput.addEventListener("change", () => saveSessionInfo(r.dt.key, r.session.id, { teeTime: timeInput.value.trim() }));
    fields.appendChild(courseInput); fields.appendChild(timeInput);

    row.appendChild(headline); row.appendChild(fields);
    return row;
  }

  function allSessionRows() {
    const rows = [];
    monthDates.forEach((dt) => {
      daySessions(dt.key).forEach((session) => {
        const count = sessionCount(session);
        if (count > 0) rows.push({ dt, session, count });
      });
    });
    return rows;
  }

  function renderConfirmed() {
    const rows = allSessionRows();

    const upcoming = rows.filter((r) => !isPastDate(r.dt.key)).sort((a, b) => a.dt.day - b.dt.day);
    const past = rows.filter((r) => isPastDate(r.dt.key)).sort((a, b) => b.dt.day - a.dt.day);

    confirmedEl.innerHTML = "";

    if (upcoming.length === 0) {
      const p = document.createElement("p"); p.className = "empty-note"; p.textContent = "目前還沒有人報名";
      confirmedEl.appendChild(p);
    } else {
      const visible = expandUpcoming ? upcoming : upcoming.slice(0, UPCOMING_PREVIEW_COUNT);
      visible.forEach((r, i) => confirmedEl.appendChild(buildConfirmedRow(r, i + 1, false)));

      if (upcoming.length > UPCOMING_PREVIEW_COUNT) {
        const moreBtn = document.createElement("button");
        moreBtn.type = "button"; moreBtn.className = "list-toggle";
        moreBtn.textContent = expandUpcoming ? "收合球局" : `展開球局（還有 ${upcoming.length - UPCOMING_PREVIEW_COUNT} 場）`;
        moreBtn.addEventListener("click", () => { expandUpcoming = !expandUpcoming; renderConfirmed(); });
        confirmedEl.appendChild(moreBtn);
      }
    }

    if (past.length > 0) {
      const pastBtn = document.createElement("button");
      pastBtn.type = "button"; pastBtn.className = "list-toggle past-toggle";
      pastBtn.textContent = showPastGames ? "隱藏過去球局" : `過去球局（${past.length} 場）`;
      pastBtn.addEventListener("click", () => { showPastGames = !showPastGames; renderConfirmed(); });
      confirmedEl.appendChild(pastBtn);

      if (showPastGames) {
        past.forEach((r, i) => confirmedEl.appendChild(buildConfirmedRow(r, i + 1, true)));
      }
    }
  }

  function buildCopyText() {
    const rows = allSessionRows().sort((a, b) => a.dt.day - b.dt.day);

    const lines = [`『${target.month + 1}月打球開團囉⛳️』`];
    rows.forEach((r) => {
      const names = sessionEntries(r.session).map(([, e]) => entryLabel(e)).join(", ");
      const prefix = [r.session.course, r.session.teeTime].filter(Boolean).join(" ");
      const body = [prefix, names].filter(Boolean).join(" ");
      lines.push(`『${target.month + 1}/${r.dt.day}』：${body} — ${r.count}`);
    });
    return lines.join("\n");
  }

  const copyBtn = document.getElementById("copy-btn");
  copyBtn.addEventListener("click", async () => {
    const text = buildCopyText();
    try {
      await navigator.clipboard.writeText(text);
    } catch (e) {
      const ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); } catch (e2) {}
      document.body.removeChild(ta);
    }
    const original = copyBtn.textContent;
    copyBtn.textContent = "已複製！";
    copyBtn.classList.add("copied");
    setTimeout(() => { copyBtn.textContent = original; copyBtn.classList.remove("copied"); }, 1500);
  });

  // ---- day entry: session picker (when a day has 2+ outings) ----
  const pickerBackdrop = document.getElementById("picker-backdrop");
  const sessionListEl = document.getElementById("session-list");
  let pickerDateKey = null;

  function sessionLabel(session) {
    return [session.course, session.teeTime].filter(Boolean).join(" · ") || "（尚未填球場/時間）";
  }

  // A day with no sessions yet goes straight to the sign-up sheet for a new,
  // not-yet-created session (nothing is written until Save is pressed — see
  // openSheet/sheet-save). Any day that already has one or more sessions
  // shows the picker so there's a way to reach "＋ 開新的球局".
  function openDayEntry(dateKey) {
    const sessions = daySessions(dateKey);
    if (sessions.length === 0) { openSheet(dateKey, null); return; }
    openPicker(dateKey);
  }

  function openPicker(dateKey) {
    pickerDateKey = dateKey;
    const dt = monthDates.find((d) => d.key === dateKey);
    document.getElementById("picker-title").textContent = `${target.month + 1}/${dt.day} 選擇球局`;
    sessionListEl.innerHTML = "";
    daySessions(dateKey).forEach((session) => {
      const item = document.createElement("div"); item.className = "session-item";
      const info = document.createElement("div"); info.className = "s-info";
      const title = document.createElement("span"); title.className = "s-title"; title.textContent = sessionLabel(session);
      const sub = document.createElement("span"); sub.className = "s-sub"; sub.textContent = `${sessionCount(session)} 人`;
      info.appendChild(title); info.appendChild(sub);

      const actions = document.createElement("div"); actions.className = "s-actions";
      const delBtn = document.createElement("button"); delBtn.type = "button"; delBtn.className = "danger";
      delBtn.textContent = "刪除球局";
      delBtn.addEventListener("click", async () => {
        if (!confirm(`確定要刪除「${sessionLabel(session)}」這個球局嗎？目前有 ${sessionCount(session)} 人報名，刪除後無法復原。`)) return;
        await deleteSessionApi(dateKey, session.id);
        if (daySessions(dateKey).length > 0) openPicker(dateKey); else closePicker();
      });
      const btn = document.createElement("button"); btn.type = "button";
      btn.textContent = myCountInSession(session) > 0 ? "編輯" : "報名";
      btn.addEventListener("click", () => { closePicker(); openSheet(dateKey, session.id); });
      actions.appendChild(delBtn); actions.appendChild(btn);

      item.appendChild(info); item.appendChild(actions);
      sessionListEl.appendChild(item);
    });
    pickerBackdrop.classList.add("open");
  }
  function closePicker() { pickerBackdrop.classList.remove("open"); pickerDateKey = null; }

  document.getElementById("picker-cancel").addEventListener("click", closePicker);
  document.getElementById("picker-new").addEventListener("click", () => {
    const dateKey = pickerDateKey;
    closePicker();
    if (dateKey) openSheet(dateKey, null); // created lazily on Save, not here
  });
  pickerBackdrop.addEventListener("click", (e) => { if (e.target === pickerBackdrop) closePicker(); });

  async function deleteSessionApi(dateKey, sessionId) {
    const idToken = freshIdToken();
    if (!idToken) { handleExpiredSession(); return false; }
    try {
      const res = await fetch("/api/session/delete", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ idToken, groupId, month: monthKey, date: dateKey, sessionId }),
      });
      const data = await res.json();
      if (res.ok) { daysData = data.days; render(); return true; }
      if (res.status === 401) handleExpiredSession();
    } catch (e) { connText.textContent = "網路異常，請重試"; }
    return false;
  }

  async function createSession(dateKey) {
    const idToken = freshIdToken();
    if (!idToken) { handleExpiredSession(); return null; }
    try {
      const res = await fetch("/api/session/create", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ idToken, groupId, month: monthKey, date: dateKey }),
      });
      const data = await res.json();
      if (res.ok) {
        daysData = data.days; render();
        return (daysData[dateKey].sessions || []).find((s) => s.id === data.sessionId);
      }
      if (res.status === 401) handleExpiredSession();
    } catch (e) { connText.textContent = "網路異常，請重試"; }
    return null;
  }

  // ---- headcount sheet ----
  const backdrop = document.getElementById("sheet-backdrop");
  const sheetTitle = document.getElementById("sheet-title");
  const sheetSub = document.getElementById("sheet-sub");
  const stepCount = document.getElementById("step-count");
  const guestNamesEl = document.getElementById("guest-names");
  let sheetDateKey = null;
  let sheetSessionId = null;
  let sheetCount = 1;
  let sheetGuestNames = [];

  function renderGuestInputs() {
    guestNamesEl.innerHTML = "";
    for (let i = 0; i < sheetCount - 1; i++) {
      const input = document.createElement("input");
      input.type = "text";
      input.maxLength = 30;
      input.placeholder = `第 ${i + 2} 位球友姓名（可留空）`;
      input.value = sheetGuestNames[i] || "";
      input.addEventListener("input", () => { sheetGuestNames[i] = input.value; });
      guestNamesEl.appendChild(input);
    }
  }

  // sessionId is null for a brand-new outing that doesn't exist on the
  // server yet — it's only actually created if Save is pressed with a
  // headcount above 0 (see sheet-save), so opening/exiting this sheet never
  // leaves a phantom empty session behind.
  function openSheet(dateKey, sessionId) {
    sheetDateKey = dateKey;
    sheetSessionId = sessionId;
    const session = sessionId ? daySessions(dateKey).find((s) => s.id === sessionId) : null;
    const mine = session && session.entries && session.entries["line:" + myUserId];
    sheetCount = mine ? mine.count : 1; // a brand-new sign-up starts at 1; editing an existing one can be lowered to 0 to leave
    sheetGuestNames = mine && mine.guestNames ? mine.guestNames.slice() : [];
    stepCount.textContent = sheetCount;
    renderGuestInputs();
    const dt = monthDates.find((d) => d.key === dateKey);
    sheetTitle.textContent = `${target.month + 1}/${dt.day} 報名人數`;
    sheetSub.textContent = "第一位是你自己，其他欄位可以填幫忙報名的朋友姓名；人數歸零並儲存即為退出這團";
    document.getElementById("sheet-delete").style.display = session ? "" : "none";
    backdrop.classList.add("open");
  }
  function closeSheet() {
    backdrop.classList.remove("open");
    sheetDateKey = null;
    sheetSessionId = null;
    if (pendingRender) { pendingRender = false; render(); }
  }

  document.getElementById("step-minus").addEventListener("click", () => {
    sheetCount = Math.max(0, sheetCount - 1); stepCount.textContent = sheetCount; renderGuestInputs();
  });
  document.getElementById("step-plus").addEventListener("click", () => {
    sheetCount = Math.min(20, sheetCount + 1); stepCount.textContent = sheetCount; renderGuestInputs();
  });
  // 退出：直接關閉，不做任何變更
  document.getElementById("sheet-exit").addEventListener("click", () => {
    closeSheet();
  });
  // 刪除：整個球局都刪掉（不只是自己的報名），需要確認
  document.getElementById("sheet-delete").addEventListener("click", async () => {
    const dateKey = sheetDateKey, sessionId = sheetSessionId;
    const session = dateKey && daySessions(dateKey).find((s) => s.id === sessionId);
    if (!session) return closeSheet();
    const label = sessionLabel(session);
    const count = sessionCount(session);
    if (!confirm(`確定要刪除「${label}」這個球局嗎？目前有 ${count} 人報名，刪除後無法復原。`)) return;
    closeSheet();
    await deleteSessionApi(dateKey, sessionId);
  });
  // 儲存：套用人數與姓名的變更（人數 0 等於退出這團）。全新的球局要先在這裡才真正建立，
  // 如果一路降到 0 人就儲存，代表根本不需要開這團，直接關閉即可，不留下空球局。
  document.getElementById("sheet-save").addEventListener("click", async () => {
    if (!sheetDateKey) return closeSheet();
    const dateKey = sheetDateKey, count = sheetCount, guestNames = sheetGuestNames.slice(0, Math.max(0, sheetCount - 1));
    let sessionId = sheetSessionId;
    closeSheet();
    if (!sessionId) {
      if (count <= 0) return;
      const session = await createSession(dateKey);
      if (!session) return;
      sessionId = session.id;
    }
    submitVote(dateKey, sessionId, count, guestNames);
  });
  backdrop.addEventListener("click", (e) => { if (e.target === backdrop) closeSheet(); });

  let myUserId = null;
  let liffReady = false;

  // liff.getIDToken() can go stale/null after the token's ~1hr lifetime, especially
  // now that the page stays open and polling — always ask LIFF for the current one
  // right before a write instead of reusing whatever we got at page load.
  function freshIdToken() {
    if (!liffReady) { console.warn("freshIdToken: liff not ready"); return null; }
    try {
      const t = liff.getIDToken();
      if (!t) console.warn("freshIdToken: liff.getIDToken() returned falsy", {
        isLoggedIn: safeCall(() => liff.isLoggedIn()),
        isInClient: safeCall(() => liff.isInClient()),
        os: safeCall(() => liff.getOS()),
        hasAccessToken: !!safeCall(() => liff.getAccessToken()),
      });
      return t;
    } catch (e) {
      console.warn("freshIdToken threw", e);
      return null;
    }
  }
  function safeCall(fn) { try { return fn(); } catch (e) { return "err:" + e; } }

  // In External Browser mode, LIFF only actually re-acquires an id_token
  // during a real interactive login round-trip through access.line.me — a
  // plain reload just restores the already-logged-in session as-is, silently
  // keeping whatever (possibly now-expired) id_token was cached. So recovery
  // here is a forced logout+login, not a reload.
  function handleExpiredSession() {
    const debug = {
      isLoggedIn: safeCall(() => liff.isLoggedIn()),
      isInClient: safeCall(() => liff.isInClient()),
      os: safeCall(() => liff.getOS()),
      hasAccessToken: !!safeCall(() => liff.getAccessToken()),
    };
    console.warn("handleExpiredSession", debug);
    connText.textContent = `登入已過期，正在重新登入…（登入:${debug.isLoggedIn} LINE內:${debug.isInClient} 系統:${debug.os}）`;
    connDot.classList.add("offline");
    setTimeout(() => {
      try { liff.logout(); } catch (e) {}
      liff.login();
    }, 1200);
  }

  async function submitVote(dateKey, sessionId, count, guestNames) {
    const idToken = freshIdToken();
    if (!idToken) return handleExpiredSession();
    try {
      const res = await fetch("/api/vote", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ idToken, groupId, month: monthKey, date: dateKey, sessionId, count, guestNames: guestNames || [] }),
      });
      const data = await res.json();
      if (res.ok) { daysData = data.days; render(); }
      else if (res.status === 401) handleExpiredSession();
      else connText.textContent = "報名失敗：" + (data.error || "請重試");
    } catch (e) { connText.textContent = "網路異常，請重試"; }
  }

  async function saveSessionInfo(dateKey, sessionId, patch) {
    const idToken = freshIdToken();
    if (!idToken) return handleExpiredSession();
    try {
      const res = await fetch("/api/session", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ idToken, groupId, month: monthKey, date: dateKey, sessionId, ...patch }),
      });
      const data = await res.json();
      if (res.ok) { daysData = data.days; render(); }
      else if (res.status === 401) handleExpiredSession();
    } catch (e) {}
  }

  let lastStateJson = null;

  async function loadState({ silent } = {}) {
    if (!groupId) return;
    try {
      const res = await fetch(`/api/state?groupId=${encodeURIComponent(groupId)}&month=${encodeURIComponent(monthKey)}`);
      const data = await res.json();
      const json = JSON.stringify(data.days || {});
      connText.textContent = "已連線";
      connDot.classList.remove("offline");

      if (json === lastStateJson) return; // nothing changed — skip re-render so open inputs/sheet aren't disturbed
      lastStateJson = json;
      daysData = data.days || {};

      // Don't yank focus away from a field the viewer is actively typing in, or close an open headcount sheet.
      const activeTag = document.activeElement && document.activeElement.tagName;
      if (sheetDateKey || activeTag === "INPUT") { pendingRender = true; return; }
      render();
    } catch (e) {
      if (!silent) {
        connText.textContent = "連線失敗，稍後重試";
        connDot.classList.add("offline");
      }
    }
  }

  // ---- message board ----
  const boardInput = document.getElementById("board-input");
  const boardPostBtn = document.getElementById("board-post");
  const boardListEl = document.getElementById("board-list");
  let boardMessages = [];
  let boardLoaded = false;

  function timeLabel(ts) {
    const d = new Date(ts);
    return `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function renderBoard() {
    boardListEl.innerHTML = "";
    if (boardMessages.length === 0) {
      const p = document.createElement("p"); p.className = "empty-note"; p.textContent = "還沒有人留言";
      boardListEl.appendChild(p);
      return;
    }
    const sorted = boardMessages.slice().sort((a, b) => {
      if (!!a.pinned !== !!b.pinned) return a.pinned ? -1 : 1;
      return b.createdAt - a.createdAt;
    });
    sorted.forEach((m) => {
      const card = document.createElement("div"); card.className = "board-card" + (m.pinned ? " pinned" : "");
      const head = document.createElement("div"); head.className = "b-head";
      if (m.pinned) { const flag = document.createElement("span"); flag.className = "pin-flag"; flag.textContent = "📌 置頂"; head.appendChild(flag); }
      if (m.pictureUrl) { const img = document.createElement("img"); img.src = m.pictureUrl; head.appendChild(img); }
      const name = document.createElement("span"); name.className = "b-name"; name.textContent = m.displayName || "球友";
      const time = document.createElement("span"); time.className = "b-time"; time.textContent = timeLabel(m.createdAt);
      head.appendChild(name); head.appendChild(time);

      const text = document.createElement("div"); text.className = "b-text"; text.textContent = m.text;

      card.appendChild(head); card.appendChild(text);

      if (m.lineUserId === myUserId) {
        const actions = document.createElement("div"); actions.className = "b-actions";
        const pinBtn = document.createElement("button"); pinBtn.type = "button";
        pinBtn.textContent = m.pinned ? "取消置頂" : "置頂";
        pinBtn.addEventListener("click", () => boardSetPin(m.id, !m.pinned));
        const delBtn = document.createElement("button"); delBtn.type = "button"; delBtn.className = "danger";
        delBtn.textContent = "刪除";
        delBtn.addEventListener("click", () => { if (confirm("確定要刪除這則留言嗎？")) boardDelete(m.id); });
        actions.appendChild(pinBtn); actions.appendChild(delBtn);
        card.appendChild(actions);
      }

      boardListEl.appendChild(card);
    });
  }

  async function loadBoard() {
    try {
      const res = await fetch(`/api/board?groupId=${encodeURIComponent(groupId)}`);
      const data = await res.json();
      boardMessages = data.messages || [];
      boardLoaded = true;
      renderBoard();
    } catch (e) {}
  }

  boardPostBtn.addEventListener("click", async () => {
    const text = boardInput.value.trim();
    if (!text) return;
    const idToken = freshIdToken();
    if (!idToken) return handleExpiredSession();
    boardPostBtn.disabled = true;
    try {
      const res = await fetch("/api/board/post", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ idToken, groupId, text }),
      });
      const data = await res.json();
      if (res.ok) { boardMessages = data.messages; boardInput.value = ""; renderBoard(); }
      else if (res.status === 401) handleExpiredSession();
    } catch (e) {}
    boardPostBtn.disabled = false;
  });

  async function boardDelete(messageId) {
    const idToken = freshIdToken();
    if (!idToken) return handleExpiredSession();
    try {
      const res = await fetch("/api/board/delete", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ idToken, groupId, messageId }),
      });
      const data = await res.json();
      if (res.ok) { boardMessages = data.messages; renderBoard(); }
    } catch (e) {}
  }

  async function boardSetPin(messageId, pinned) {
    const idToken = freshIdToken();
    if (!idToken) return handleExpiredSession();
    try {
      const res = await fetch("/api/board/pin", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ idToken, groupId, messageId, pinned }),
      });
      const data = await res.json();
      if (res.ok) { boardMessages = data.messages; renderBoard(); }
    } catch (e) {}
  }

  let pendingRender = false;
  let pollTimer = null;
  function startPolling() {
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(() => {
      loadState({ silent: true });
      if (viewBoard.classList.contains("active")) loadBoard();
    }, 4000);
  }
  document.addEventListener("focusout", () => {
    setTimeout(() => {
      const activeTag = document.activeElement && document.activeElement.tagName;
      if (pendingRender && !sheetDateKey && activeTag !== "INPUT") { pendingRender = false; render(); }
    }, 0);
  });

  async function init() {
    updateHeader();
    render();
    try {
      const cfgRes = await fetch("/api/config");
      const cfg = await cfgRes.json();
      if (!cfg.liffId) throw new Error("LIFF_ID not configured");

      await liff.init({ liffId: cfg.liffId });
      if (!liff.isLoggedIn()) { liff.login(); return; }

      // A login from before the openid scope was added (or any other stale
      // grant) can leave isLoggedIn() true with no id_token available, which
      // no amount of reloading fixes on its own — force one fresh login.
      if (!liff.getIDToken()) {
        const retried = sessionStorage.getItem("liff_relogin_attempted");
        if (!retried) {
          sessionStorage.setItem("liff_relogin_attempted", "1");
          liff.logout();
          liff.login();
          return;
        }
        throw new Error("no id_token even after re-login");
      }
      sessionStorage.removeItem("liff_relogin_attempted");

      liffReady = true;
      const profile = await liff.getProfile();
      myUserId = profile.userId;

      meBox.innerHTML = "";
      const img = document.createElement("img"); img.src = profile.pictureUrl || "";
      const name = document.createElement("span"); name.textContent = profile.displayName;
      const chev = document.createElement("span"); chev.className = "chev"; chev.textContent = "▾";
      if (profile.pictureUrl) meBox.appendChild(img);
      meBox.appendChild(name);
      meBox.appendChild(chev);

      await loadState();
      startPolling();
    } catch (e) {
      connText.textContent = "無法連接 LINE，僅供預覽";
      connDot.classList.add("offline");
      meBox.textContent = "未連接 LINE";
    }
  }

  init();
})();
</script>
</body>
</html>
